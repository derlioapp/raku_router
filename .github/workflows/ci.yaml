name: ci

# Least privilege: CI only reads the repo.
permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    name: format · guard · analyze · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test example
      - name: Forbidden-import guard
        run: tool/check_forbidden_imports.sh
      - name: Analyze (fatal infos + warnings)
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        run: flutter test

  pana:
    name: pana 160/160
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      # Pinned: a new pana can change scoring rules; bump it deliberately.
      - name: Install pana
        run: dart pub global activate pana 0.23.19
      - name: pana — require the full pub score
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          pana --no-warning --json . > pana.json
          granted=$(jq '.scores.grantedPoints' pana.json)
          max=$(jq '.scores.maxPoints' pana.json)
          echo "pana score: $granted/$max"
          test "$granted" -ge "$max"

  floor:
    name: floor (Flutter 3.27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The declared SDK floor — proves raku_router compiles on Flutter 3.27 / Dart
      # 3.6, the lowest it claims to support.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.27.0
          channel: stable
      # Dev-only deps newer than the floor: material_ui (the tests' Material)
      # needs Flutter >= 3.47 and flutter_lints 6 needs Dart >= 3.8. On the floor
      # the same widgets come from the SDK and lints 5 still supports Dart 3.6.
      - name: Use floor-compatible dev dependencies
        run: |
          sed -i '/material_ui:/d' pubspec.yaml example/pubspec.yaml
          sed -i 's/flutter_lints: \^6\.0\.0/flutter_lints: ^5.0.0/' pubspec.yaml example/pubspec.yaml
          grep -rl 'package:material_ui/material_ui.dart' test example/lib \
            | xargs sed -i 's#package:material_ui/material_ui.dart#package:flutter/material.dart#'
      - run: flutter pub get
      # Warnings/errors only: the floor proves the code compiles and passes.
      # Style infos are the verify job's (the import swap above reorders
      # directives, which directives_ordering would flag here).
      - run: flutter analyze --no-fatal-infos --fatal-warnings
      - run: flutter test

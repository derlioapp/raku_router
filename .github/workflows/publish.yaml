name: publish

# Publishes to pub.dev when a release tag (v1.2.3, v1.0.0-rc.1, …) is pushed,
# using pub.dev's *automated publishing* (GitHub OIDC): no long-lived pub.dev
# credential is stored anywhere. One-time setup on pub.dev → raku_router →
# Admin → Automated publishing: enable GitHub Actions, repository
# `derlioapp/raku_router`, tag pattern `v{{version}}`, and (recommended)
# require the `pub.dev` environment so a reviewer approves each release.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  publish:
    name: publish to pub.dev
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # the OIDC token pub.dev verifies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Configures pub to authenticate with the job's OIDC token.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Tag must match the pubspec version
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version" >&2
            exit 1
          fi
      - run: flutter pub get
      - name: Verify (analyze + test) before publishing
        run: |
          tool/check_forbidden_imports.sh
          flutter analyze --fatal-infos --fatal-warnings
          flutter test
      - name: Publish
        run: flutter pub publish --force

name: raku_router_example
description: Example app demonstrating raku_router (tabs, guard, deep link, full-page route).
publish_to: 'none'
version: 0.3.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  raku_router:
    path: ../
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
